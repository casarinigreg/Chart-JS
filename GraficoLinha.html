<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div style="display: flex;">
        <div style="width: 50%;">
            <canvas id="graficoTemp"></canvas>
        </div>
        <div style="width: 50%;">
            <canvas id="graficoUmi"></canvas>
        </div>
    </div>
</body>
</html>
<script>
 const temperatura = document.getElementById('graficoTemp');

  new Chart(temperatura, {
    type: 'line',
    data: {
      labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
      datasets: [{
        label: 'Temperatura °C',
        data: [30, 29, 28, 25, 22, 23],
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
        beginAtZero: true,
        min: 0,
        max: 30,
        ticks: {
        stepSize: 5
        }
        }
      }
    }
  });

  const umidade = document.getElementById('graficoUmi');

  new Chart(umidade, {
    type: 'line',
    data: {
      labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
      datasets: [{
        label: 'Umidade (%)',
        data: [80, 82, 80, 85, 80, 83],
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
        beginAtZero: true,
        min: 0,
        max: 90,
        ticks: {
        stepSize: 10
        }
        }
      }
    }
  });

</script>
